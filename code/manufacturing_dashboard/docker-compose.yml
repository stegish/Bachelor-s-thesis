version: '3.8'

services:
  # Analytics API
  analytics_api:
    build: ../manufactoring_analytics
    container_name: manufacturing_analytics_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI}
      DATABASE_NAME: ${DATABASE_NAME:-manufacturing_db}
      OUTPUT_DIR: /app/analytics_output
      SCHEDULE_INTERVAL_MINUTES: ${SCHEDULE_INTERVAL_MINUTES:-60}
    ports:
      - "5000:5000"
    volumes:
      - analytics_output:/app/analytics_output
    networks:
      - manufacturing_network

  # LLM Service
  llm_service:
    build: ../llm_service
    container_name: manufacturing_llm
    restart: unless-stopped
    depends_on:
      - analytics_api
    env_file:
      - .env
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-claude-3-5-sonnet-20241022}
      MONGO_URI: ${MONGO_URI}
      DATABASE_NAME: ${DATABASE_NAME:-manufacturing_db}
      AI_MANAGER_DB_URI: ${AI_MANAGER_DB_URI}
      AI_MANAGER_DB_NAME: ${AI_MANAGER_DB_NAME:-AI-manager}
      ANALYTICS_SERVICE_URL: http://analytics_api:5000
    ports:
      - "5001:5001"
    networks:
      - manufacturing_network

  # Frontend
  frontend:
    build: .
    container_name: manufacturing_frontend
    restart: unless-stopped
    depends_on:
      - analytics_api
      - llm_service
    env_file:
      - .env
    environment:
      REACT_APP_ANALYTICS_API: ${REACT_APP_ANALYTICS_API:-http://localhost:5000}
      REACT_APP_LLM_API: ${REACT_APP_LLM_API:-http://localhost:5001}
      REACT_APP_ENV: ${REACT_APP_ENV:-production}
    ports:
      - "3000:80"
    networks:
      - manufacturing_network

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: manufacturing_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - analytics_api
      - llm_service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - manufacturing_network

volumes:
  analytics_output:

networks:
  manufacturing_network:
    driver: bridge