version: '3.8'

services:
  # LLM Service for Manufacturing Analytics
  llm_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manufacturing_llm
    restart: unless-stopped
    environment:
      # Claude API Configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-claude-3-sonnet-20240229}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
      TEMPERATURE: ${TEMPERATURE:-0.7}
      
      # MongoDB Configuration (connect to existing MongoDB)
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/}
      DATABASE_NAME: ${DATABASE_NAME:-manufacturing_db}
      
      # Flask Configuration
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "5001:5001"
    networks:
      - manufacturing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - llm_logs:/app/logs

  # Redis for caching (optional, for future enhancement)
  redis:
    image: redis:7-alpine
    container_name: manufacturing_llm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - manufacturing_network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    profiles:
      - cache

volumes:
  llm_logs:
    driver: local
  redis_data:
    driver: local

networks:
  manufacturing_network:
    external: true
    name: manufactoring-analytics_manufacturing_network