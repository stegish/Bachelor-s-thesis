version: '3.8'

services:
  # Manufacturing Analytics API
  analytics_api:
    build: .
    container_name: manufacturing_analytics_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./analytics_output:/app/analytics_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s